[project]
name = "errium"
version = "0.1.2"
description = "Intelligent API error normalization and exception handling infrastructure for FastAPI and beyond."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dagmawi Napoleon Bogale" }
]
license = { text = "MIT" }

keywords = [
    "fastapi",
    "api",
    "error-handling",
    "exception-handling",
    "error-normalization",
    "pydantic"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Framework :: Flask",
]

dependencies = [
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "starlette>=1.1.0",
]

[project.optional-dependencies]
flask = ["flask>=3.0.0"]
ninja = ["django-ninja>=1.3.0"]
drf = ["djangorestframework>=3.15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rest_framework.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/errium", "src/errium_core", "src/errium_flask", "src/errium_ninja", "src/errium_drf"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    "CLAUDE.md",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/errium",
    "src/errium_core",
    "src/errium_flask",
    "src/errium_ninja",
    "src/errium_drf"
]

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "django-ninja>=1.3.0",
    "djangorestframework>=3.15.0",
    "flask>=3.0.0",
    "httpx>=0.28.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pydantic[email]>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]

[project.urls]
Homepage = "https://errium.dagmawi.et/"
Repository = "https://github.com/Dagin34/errium"
Issues = "https://github.com/Dagin34/errium/issues"
Documentation = "https://errium.dagmawi.et/"
