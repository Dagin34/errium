site_name: Errium
site_description: The Errium documentation has moved to https://errium.dagmawi.et/
site_url: https://dagin34.github.io/errium/
repo_name: Dagin34/errium
repo_url: https://github.com/Dagin34/errium

# This site is retired. It builds a single page pointing at the new documentation
# site at https://errium.dagmawi.et/. Everything below is stripped to the minimum
# needed to serve that one notice — no nav, no search, no theme toggle.

nav:
  - Home: index.md

theme:
  name: material
  custom_dir: overrides
  font:
    text: Poppins
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
  features: []

extra_css:
  - assets/errium.css

markdown_extensions:
  - md_in_html
